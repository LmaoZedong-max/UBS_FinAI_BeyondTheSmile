server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SSE stream for /api/chat/stream — disable buffering so events reach the
    # browser immediately.
    location /api/chat/stream {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering    off;
        proxy_cache        off;
        # Keep the connection alive long enough for streaming responses
        proxy_read_timeout 300s;
    }

    # All other /api/ requests proxied to the FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering    on;
        proxy_read_timeout 120s;
    }

    # SPA fallback — all other requests return index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
